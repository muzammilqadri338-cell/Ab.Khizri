<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آبِ خضری – آرڈر فارم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f6ec;--card:#ffffff;--ink:#17301d;--muted:#5a6b5e;--green:#1f5a30;--gold:#f2b600;--line:#c9d8c4;--err:#b3261e;--onbtn:#ffffff;
  --s1:#0f7a3a;--s2:#c26a00;--s3:#d62828;--s4:#7b2cbf;--s5:#1565c0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a11;--card:#172419;--ink:#e8f1e5;--muted:#a3b5a6;--green:#5fbf7a;--gold:#f2b600;--line:#2d4132;--err:#ff8a80;--onbtn:#0f1a11;--s1:#4ade80;--s2:#fbbf24;--s3:#f87171;--s4:#c084fc;--s5:#60a5fa}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a11;--card:#172419;--ink:#e8f1e5;--muted:#a3b5a6;--green:#5fbf7a;--gold:#f2b600;--line:#2d4132;--err:#ff8a80;--onbtn:#0f1a11;--s1:#4ade80;--s2:#fbbf24;--s3:#f87171;--s4:#c084fc;--s5:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic",serif;font-size:18px;line-height:1.9}
html[lang="en"] body,html[lang="ur-Latn"] body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.6}
html[lang="hi"] body{font-family:"Noto Sans Devanagari",system-ui,sans-serif;font-size:17px;line-height:1.7}
html[lang="zh-Hans"] body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:17px;line-height:1.7}
main{max-width:30rem;margin:0 auto;padding:1rem 1.1rem 2.5rem}
.langbar{display:flex;justify-content:center;margin:.2rem 0 .4rem}
.langbar select{font:inherit;font-size:1rem;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:.25rem .9rem;cursor:pointer}
.brand{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;font-weight:700;font-size:2.8rem;line-height:1.9;margin:.2rem 0 0;text-align:center;
  background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s1));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shade 7s linear infinite}
@keyframes shade{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){.brand{animation:none}}
.sub{margin:0 0 1rem;color:var(--muted);text-align:center}
.poster{display:block;width:min(100%,26rem);height:auto;margin:0 auto 1.4rem;border-radius:1rem}
.offer{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--gold);color:#2a2100;border-radius:.9rem;padding:.7rem 1rem;font-weight:600;line-height:1.6;margin-bottom:1.4rem}
.offer small{font-weight:400}
.offer b{font-size:1.5rem;white-space:nowrap}
form{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.2rem}
label{display:block;font-weight:600;margin-top:.6rem}
label small{font-weight:400;color:var(--muted)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:.6rem;padding:.5rem .8rem;line-height:1.6}
textarea{min-height:5.5rem;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a.btn:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ltr{direction:ltr;text-align:right}
html[dir="ltr"] .ltr{text-align:left}
.err{color:var(--err);font-size:.9rem;min-height:1.4rem;margin:0}
button,a.btn{display:block;width:100%;margin-top:1rem;font:inherit;font-weight:600;font-size:1.1rem;text-align:center;text-decoration:none;color:var(--onbtn);background:var(--green);border:0;border-radius:.7rem;padding:.7rem 1rem;cursor:pointer}
#gm,#bg{background:#b3261e;color:#fff}
#done{display:none;background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;text-align:center}
#done.show{display:block}
#done p{margin:.2rem 0}
.qty{display:flex;gap:.5rem;align-items:center}.qty input{text-align:center;font-weight:600}.qty .step{width:3.2rem;margin:0;padding:.4rem 0;font-size:1.4rem;flex:none}.total{margin:.3rem 0;font-weight:600;color:var(--green)}
.note{color:var(--muted);font-size:.9rem;text-align:center;margin-top:1rem}
</style>
</head>

  var f=$("f"),done=$("done"),wa=$("wa"),gm=$("gm"),gm2=$("gm2"),cp=$("cp"),q=$("q"),sel=$("lang");
  function qty(){var v=parseInt(q.value,10);return isNaN(v)?0:v}
  function rate(v){return v>=BULKQ?BULKP:PRICE}
  function freeQ(v){return (v>0&&v<BULKQ)?Math.floor(v/PER)*FREE:0}
  function money(v){var sub=v*rate(v),dl=v>DELFREE?Math.ceil(v/DELQ)*DELP:0;return{sub:sub,dl:dl,tot:sub+dl}}
  function set(id,msg){$(id).textContent=msg||"";return !msg}

  function upd(){
    var v=qty(),mo=money(v),fq=freeQ(v),rs=L[cur].rs;
    $("tot").textContent=v>0?T("total",{t:mo.tot,rs:rs}):T("total",{t:"--",rs:""});
    $("tx").textContent=v<=0?"":(mo.dl>0?T("brk",{s:mo.sub,d:mo.dl,rs:rs}):T("dfree"));
    $("fr").textContent=v>=BULKQ?T("frB",{rs:rs}):(fq>0?T("frF",{f:fq,n:v+fq}):T("frA"))+T("frH",{rs:rs});
  }
  function apply(){
    var D=L[cur],h=document.documentElement;
    h.lang=D.c;h.dir=D.d;sel.value=cur;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(el){el.textContent=T(el.getAttribute("data-i"),{rs:D.rs})});
    Array.prototype.forEach.call(document.querySelectorAll("[data-h]"),function(el){el.innerHTML=T(el.getAttribute("data-h"))});
    $("pr").textContent=D.pre?D.rs+" "+PRICE:PRICE+" "+D.rs;
    $("poster").alt=T("alt");
    ["en","ep","ea","eq","ee"].forEach(function(id){set(id,"")});
    upd();
  }
  sel.addEventListener("change",function(){cur=sel.value;try{localStorage.setItem("lang",cur)}catch(x){}apply()});

  function copyTxt(t,btn){
    var ok=false;
    try{navigator.clipboard.writeText(t);ok=true}catch(x){}
    if(!ok){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok=true}catch(x){}document.body.removeChild(ta)}
    btn.textContent=ok?T("cpok"):T("cpno");
  }
  $("qm").addEventListener("click",function(){q.value=Math.max(1,qty()-1);upd()});
  $("qp").addEventListener("click",function(){q.value=Math.min(MAXQ,qty()+1);upd()});
  q.addEventListener("input",upd);

  f.addEventListener("submit",function(ev){
    ev.preventDefault();
    var n=f.n.value.trim(),p=f.p.value.trim(),a=f.a.value.trim(),e=f.e.value.trim();
    var ok=true;
    ok=set("en",n?"":T("en"))&&ok;
    ok=set("ep",p.replace(/\D/g,"").length>=10?"":T("ep"))&&ok;
    ok=set("ea",a.length>=8?"":T("ea"))&&ok;
    ok=set("eq",(qty()>=1&&qty()<=MAXQ)?"":T("eq",{m:MAXQ}))&&ok;
    ok=set("ee",(!e||/^\S+@\S+\.\S+$/.test(e))?"":T("ee"))&&ok;
    if(!ok)return;
    var v=qty(),mo=money(v),fq=freeQ(v);
    /* the order message is always written in Urdu so the seller can read it */
    var text="آرڈر: آبِ خضری (Cumin Water)\nنام: "+n+"\nفون: "+p+"\nپتہ: "+a+"\nتعداد: "+v+" بوتل"+
      (fq?"\nفری بوتلیں: "+fq+"\nکل بوتلیں: "+(v+fq):"")+(v>=BULKQ?"\nتھوک ریٹ: "+BULKP+" روپے فی بوتل":"")+
      "\nرقم: "+mo.sub+" روپے\nڈیلیوری چارجز: "+(mo.dl>0?mo.dl+" روپے":"مفت")+"\nکل رقم: "+mo.tot+" روپے"+(e?"\nای میل: "+e:"");
    wa.href="https://wa.me/"+SELLER+"?text="+encodeURIComponent(text);
    var subj="آرڈر: آبِ خضری – "+n,body=text.replace(/\n/g,"\r\n");
    gm.href="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(MAIL)+"&su="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
    gm2.href="mailto:"+MAIL+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
    cp.textContent=T("cp");
    cp.onclick=function(e2){e2.preventDefault();copyTxt(text,cp)};
    if(SCRIPT_URL){try{fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:new URLSearchParams({name:n,phone:p,address:a,qty:v,free:fq,subtotal:mo.sub,delivery:mo.dl,total:mo.tot,email:e})})}catch(x){}}
    f.style.display="none";
    done.classList.add("show");
    var via=ev.submitter&&ev.submitter.getAttribute("data-via");
    try{(via==="gm"?gm:wa).click()}catch(x){}
  });
  apply();
})();
</script>
</body>
</html>
